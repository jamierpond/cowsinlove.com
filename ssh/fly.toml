# fly.toml app configuration file generated for cowsinlove on 2026-04-29T21:34:10-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cowsinlove'
primary_region = 'lhr'

[build]

[[mounts]]
  source = 'ssh_keys'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 22
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[services.ports]]
    port = 22

  [[services.ports]]
    port = 2222

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = '512mb'
  cpus = 1
